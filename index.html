<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/CSS/main.css">
    <title>Парсер</title>
</head>
<body>
    <div class="wrapper">
        <div class="file-upload">
            <div class="file-upload__input">
                <label for="json-file">Выберите JSON-файл:</label>
                <input type="file" id="json-file" accept="application/json, text/javascript">
            </div>
            <div id="forms-container" class="file-upload__forms-container"></div>
            <div class="file-upload__actions">
                <button class="file-upload__button--reset" id="button--reset" type="reset">Сбросить форму</button>
            </div>
        </div>
    </div>
    <script src="/scripts/index.js"></script>
</body>
</html>
