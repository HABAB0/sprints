<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/CSS/main.css">
    <title>Парсер</title>
</head>
<body>
    <div class="wrapper">
        <div class="file-upload" id="file-upload">
            <div class="file-upload__inputs" id="json-upload-field">
                <label for="json-file">
                    <input type="file" class="file-upload__input" id="json-file" accept="application/json, text/javascript">
                    <span class="file-upload__button">Выберите файл</span>
                </label>
            </div>
            <div class="file-upload-wrapper" id="forms-wrapper">
                <form id="forms-container" class="file-upload__forms-container"></form>
            </div>
            <button class="file-upload__button--reset" id="button--reset" type="reset">
                <div class="file-upload__actions"></div>
                <span>Удалить форму</span>
            </button>
        </div>
    </div>
    <script src="/scripts/index.js"></script>
</body>
</html>
